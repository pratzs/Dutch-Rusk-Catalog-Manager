name: Send B2B access emails (go-live)

# One-time trigger for the 20 Jul 2026 09:00 Pacific/Auckland go-live.
# = 2026-07-19T21:00Z. We poll every minute for a window before and after
# that instant rather than firing once, because GitHub Actions' scheduler can
# run a few minutes late under load. The endpoint itself is the source of
# truth for "not before" (it no-ops until the target time) and is idempotent
# (safe to call repeatedly), so this polling window can never cause an early
# or duplicate send — it just makes sure we don't miss the moment.
#
# Safe to delete this file (and the GitHub secrets it uses) after 20 Jul 2026.

on:
  schedule:
    # Every minute from 20:55 to 21:10 UTC on 19 Jul 2026 (08:55-09:10 NZST on 20 Jul).
    - cron: "55-59 20 19 7 *"
    - cron: "0-10 21 19 7 *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (report counts only, do not send)"
        required: false
        default: "false"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-b2b-access-emails endpoint
        run: |
          DRY_RUN="${{ github.event.inputs.dryRun || 'false' }}"
          echo "Calling endpoint with dryRun=$DRY_RUN"
          curl -sf -X POST "${{ secrets.CATALOG_MANAGER_APP_URL }}/api/send-b2b-access-emails" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.B2B_EMAIL_CRON_SECRET }}" \
            -d "{\"dryRun\": $DRY_RUN}" | tee response.json
      - name: Show result
        run: cat response.json
