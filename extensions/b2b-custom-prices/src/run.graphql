query RunInput {
  # Deal config, on the DISCOUNT NODE (the shop copy is not resolved at runtime
  # for this target). Squeezed copy written by app/routes/app.bogo.jsx.
  discountNode {
    bogoBundles: metafield(namespace: "custom", key: "bogo_fn") {
      value
    }
  }
  cart {
    buyerIdentity {
      purchasingCompany {
        company {
          priceListId: metafield(namespace: "custom", key: "catalog_pricelist_id") {
            value
          }
        }
      }
    }
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          # Everything this Function needs about the variant, in one field:
          #
          #   27.75|34326937913:5.25|34326774073:4.25|#dragon-2kg-5-1|
          #   ^retail  ^price list : saving off retail      ^deals
          #
          # THREE fields per cart line and no more. Every field in this query is
          # charged on every line whether the code reads it or not -- measured,
          # not assumed -- so `cost`, `merchandise.id` and `__typename` were all
          # removed and the information folded into this one string. That is what
          # took the cart limit from 80 lines to 115.
          catSavings: metafield(namespace: "custom", key: "catalog_savings") {
            value
          }
        }
      }
    }
  }
}
