query RunInput {
  # Deal config, on the DISCOUNT NODE (not the shop -- the shop copy is not
  # resolved at runtime for this target). "bogo_fn" is the squeezed copy written
  # by app/routes/app.bogo.jsx: bare numeric ids and one-letter keys, 1.5KB
  # instead of 3.9KB. It rides on EVERY cart, so those bytes are cart lines.
  discountNode {
    bogoBundles: metafield(namespace: "custom", key: "bogo_fn") {
      value
    }
  }
  cart {
    buyerIdentity {
      purchasingCompany {
        company {
          priceListId: metafield(namespace: "custom", key: "catalog_pricelist_id") {
            value
          }
        }
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          # Compact "|priceListId:price|..." string written by
          # api.catalog-price-sync. Replaces the catalog_fixed_prices JSON map:
          # same information, roughly half the bytes, and read with indexOf
          # rather than a JSON.parse on every cart line.
          #
          # Everything asked for here is paid for on EVERY line, so nothing goes
          # in this query that the Function does not actually read. The old
          # standardRetail and discountPct fields fed a fallback that calculated
          # a price from a blanket company percentage -- no company on this shop
          # has ever had one set (checked: 0 of 1,481), and the fallback could
          # only ever fire on a line the transformer had left alone, where a
          # further discount would have been a double discount anyway.
          catPrices: metafield(namespace: "custom", key: "catalog_prices_v2") {
            value
          }
        }
      }
    }
  }
}
