query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          # JSON map of priceListGid → fixedPrice string
          # Only present for variants with a custom fixed-price override in any catalog
          catalogFixedPrices: metafield(
            namespace: "custom"
            key: "catalog_fixed_prices"
          ) {
            value
          }
        }
      }
    }
    buyerIdentity {
      purchasingCompany {
        company {
          id
          # Which Shopify price list this company is on
          priceListId: metafield(
            namespace: "custom"
            key: "catalog_pricelist_id"
          ) {
            value
          }
          # Blanket discount % for this company's catalog (e.g. "20" = 20% off)
          discountPct: metafield(
            namespace: "custom"
            key: "catalog_discount_pct"
          ) {
            value
          }
        }
      }
    }
  }
}
