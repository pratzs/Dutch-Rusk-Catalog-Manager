query RunInput {
  cart {
    buyerIdentity {
      purchasingCompany {
        company {
          priceListId: metafield(namespace: "custom", key: "catalog_pricelist_id") {
            value
          }
        }
      }
    }
    lines {
      id
      merchandise {
        ... on ProductVariant {
          # Everything this Function needs about the variant, in one field:
          #
          #   27.75|34326937913:5.25|34326774073:4.25|#dragon-2kg-5-1|
          #   ^retail  ^price list : saving off retail      ^deals
          #
          # Written by api.catalog-price-sync. Only TWO fields per cart line are
          # asked for here, because every field in this query is charged on every
          # line whether the code reads it or not. That is what pays for the line
          # limit below.
          catSavings: metafield(namespace: "custom", key: "catalog_savings") {
            value
          }
        }
      }
    }
  }
}
