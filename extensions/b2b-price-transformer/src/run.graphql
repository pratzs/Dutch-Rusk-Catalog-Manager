query RunInput {
  cart {
    buyerIdentity {
      purchasingCompany {
        company {
          priceListId: metafield(namespace: "custom", key: "catalog_pricelist_id") {
            value
          }
        }
      }
    }
    lines {
      id
      merchandise {
        __typename
        ... on ProductVariant {
          id
          # Compact "|priceListId:price|..." string written by
          # api.catalog-price-sync, read with indexOf instead of JSON.parse.
          # Must stay in step with extensions/b2b-custom-prices, which reads the
          # same metafield -- the two Functions have to agree on every line or
          # one raises a price the other cannot bring back down.
          catPrices: metafield(namespace: "custom", key: "catalog_prices_v2") {
            value
          }
          standardRetail: metafield(namespace: "custom", key: "standard_retail_price") {
            value
          }
        }
      }
    }
  }
}
