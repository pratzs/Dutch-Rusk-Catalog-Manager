query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
  }
  shop {
    bogoBundles: metafield(namespace: "custom", key: "bogo_bundles") {
      value
    }
  }
}
