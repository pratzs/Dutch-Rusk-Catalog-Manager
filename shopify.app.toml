client_id = "c19c401d15d011936f4c7db6715514b3"
name = "dutch-rusk-catalog-manager"
application_url = "https://dutch-rusk-catalog-manager.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "write_metaobject_definitions,write_metaobjects,write_products,read_products"

[auth]
redirect_urls = [ "https://dutch-rusk-catalog-manager.onrender.com/api/auth/callback" ]
